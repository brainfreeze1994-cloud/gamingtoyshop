<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - GameZone</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #FFD93D; --secondary: #FF6B6B; --dark: #292F36; --light: #F7FFF7; --border-width: 3px; --shadow: 4px 4px 0px var(--dark); --radius: 15px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: #f4f4f4; color: var(--dark); }
        h1, h2, h3 { font-family: 'Fredoka One', cursive; }

        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(41, 47, 54, 0.95); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: white; padding: 2rem; border-radius: var(--radius); border: var(--border-width) solid var(--dark); box-shadow: 8px 8px 0px rgba(0,0,0,0.2); text-align: center; width: 90%; max-width: 400px; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; border: 2px solid var(--dark); border-radius: 8px; }
        
        .dashboard { display: none; padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; background: white; padding: 1rem; border: var(--border-width) solid var(--dark); border-radius: var(--radius); box-shadow: var(--shadow); }
        
        .grid-layout { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        @media(max-width: 768px) { .grid-layout { grid-template-columns: 1fr; } }

        .card { background: white; border: var(--border-width) solid var(--dark); border-radius: var(--radius); padding: 1.5rem; box-shadow: var(--shadow); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 0.5rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 2px solid var(--dark); border-radius: 8px; }
        
        .btn { background: var(--secondary); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: 'Fredoka One', cursive; border: 2px solid var(--dark); box-shadow: 2px 2px 0px var(--dark); }
        .btn:active { transform: translate(2px, 2px); box-shadow: none; }
        .btn-danger { background: #ff4757; }
        .btn-success { background: #2ed573; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { text-align: left; padding: 12px; border-bottom: 2px solid #eee; }
        th { background: var(--primary); }
        
        .status-msg { padding: 10px; margin-top: 10px; border-radius: 8px; display: none; text-align: center; font-weight: bold; }
        .status-success { background: #d4edda; color: #155724; }
        .sheet-config { background: #eef; padding: 1rem; border-radius: 8px; margin-top: 1rem; font-size: 0.9rem; }
        .sheet-config code { background: #ddd; padding: 2px 5px; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginOverlay">
        <div class="login-box">
            <h2>🔒 Admin Login</h2>
            <p>Password: admin123</p>
            <input type="password" id="adminPass" placeholder="Enter Password">
            <button class="btn" onclick="checkLogin()">Unlock</button>
            <p id="loginError" style="color:red; margin-top:10px; display:none;">Wrong password!</p>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard">
        <div class="header-bar">
            <h1>🎮 Admin Dashboard</h1>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
        </div>

        <div class="grid-layout">
            <!-- Left: Add Product -->
            <div>
                <div class="card">
                    <h3>➕ Add New Toy</h3>
                    <form id="addProductForm" onsubmit="handleAddProduct(event)">
                        <div class="form-group"><label>Toy Name</label><input type="text" id="pName" required></div>
                        <div class="form-group"><label>Description</label><textarea id="pDesc" required></textarea></div>
                        <div class="form-group"><label>Image URL</label><input type="url" id="pImage" required placeholder="https://..."></div>
                        <div class="form-group"><label>Cost Price (AED)</label><input type="number" step="0.01" id="pPriceAED" required><small>For reference</small></div>
                        <div class="form-group"><label>Cost Price (Peso)</label><input type="number" step="0.01" id="pPricePeso" required><small>For reference</small></div>
                        <div class="form-group"><label style="color:var(--secondary); font-size:1.1rem;">Final Selling Price (AED)</label><input type="number" step="0.01" id="pFinalPrice" required><small>Shown to customers</small></div>
                        <button type="submit" class="btn btn-success" style="width:100%">Add Toy</button>
                    </form>
                    <div id="formStatus" class="status-msg"></div>
                </div>
                <div class="card">
                    <h3>🔒 Change Password</h3>
                    <input type="password" id="newPass" placeholder="New Password" style="width:100%; padding:8px; margin-bottom:10px; border:2px solid #ccc; border-radius:5px;">
                    <button class="btn" onclick="changePassword()">Update</button>
                </div>
            </div>

            <!-- Right: List & Sync -->
            <div>
                <div class="card">
                    <h3>📦 Inventory</h3>
                    <table id="productsTable">
                        <thead><tr><th>Img</th><th>Name</th><th>Final Price</th><th>Action</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
                <div class="card">
                    <h3>📊 Google Sheets Sync</h3>
                    <p>Paste your Google Script Web App URL below to sync online:</p>
                    <input type="text" id="sheetUrl" placeholder="https://script.google.com/macros/s/..." style="width:100%; padding:8px; margin:10px 0; border:2px solid #ccc; border-radius:5px;">
                    <button class="btn" onclick="saveSheetConfig()">Save Config</button>
                    <p id="syncStatus" style="margin-top:10px; font-weight:bold;"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_PASS = "admin123";
        
        function checkLogin() {
            const input = document.getElementById('adminPass').value;
            const stored = localStorage.getItem('adminPassword') || DEFAULT_PASS;
            if (input === stored) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                loadProducts();
                loadSheetConfig();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }
        function logout() { location.reload(); }
        
        function changePassword() {
            const p = document.getElementById('newPass').value;
            if(p.length < 4) return alert("Too short!");
            localStorage.setItem('adminPassword', p);
            alert("Password updated!");
            document.getElementById('newPass').value = '';
        }

        function handleAddProduct(e) {
            e.preventDefault();
            const product = {
                id: Date.now(),
                name: document.getElementById('pName').value,
                desc: document.getElementById('pDesc').value,
                image: document.getElementById('pImage').value,
                priceAED: document.getElementById('pPriceAED').value,
                pricePeso: document.getElementById('pPricePeso').value,
                finalPrice: document.getElementById('pFinalPrice').value,
                date: new Date().toISOString()
            };

            let products = JSON.parse(localStorage.getItem('gamingToys_products')) || [];
            products.push(product);
            localStorage.setItem('gamingToys_products', JSON.stringify(products));

            // Sync to Sheet if configured
            const url = localStorage.getItem('gamingToys_sheetUrl');
            if(url) {
                fetch(url, { method:'POST', mode:'no-cors', body: JSON.stringify({action:'add', data:product}) })
                .then(() => showStatus("Saved locally & sent to Sheet!", "success"))
                .catch(() => showStatus("Saved locally. Sheet sync failed.", "success"));
            } else {
                showStatus("Added successfully (Local Only)", "success");
            }
            
            document.getElementById('addProductForm').reset();
            loadProducts();
        }

        function showStatus(msg, type) {
            const el = document.getElementById('formStatus');
            el.textContent = msg;
            el.className = `status-msg status-${type}`;
            el.style.display = 'block';
            setTimeout(() => el.style.display = 'none', 3000);
        }

        function loadProducts() {
            const tbody = document.querySelector('#productsTable tbody');
            tbody.innerHTML = '';
            const products = JSON.parse(localStorage.getItem('gamingToys_products')) || [];
            products.forEach((p, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td><img src="${p.image}" width="40" style="border-radius:4px"></td><td>${p.name}<br><small>AED:${p.priceAED} | PHP:${p.pricePeso}</small></td><td><b>${p.finalPrice}</b></td><td><button class="btn btn-danger" style="padding:2px 8px; font-size:0.7rem" onclick="deleteProd(${i})">X</button></td>`;
                tbody.appendChild(tr);
            });
        }

        function deleteProd(i) {
            if(!confirm("Delete?")) return;
            let products = JSON.parse(localStorage.getItem('gamingToys_products')) || [];
            products.splice(i, 1);
            localStorage.setItem('gamingToys_products', JSON.stringify(products));
            loadProducts();
        }

        function saveSheetConfig() {
            const url = document.getElementById('sheetUrl').value;
            if(!url) return alert("Enter URL");
            localStorage.setItem('gamingToys_sheetUrl', url);
            document.getElementById('syncStatus').textContent = "Saved!";
            document.getElementById('syncStatus').style.color = "green";
        }
        function loadSheetConfig() {
            const url = localStorage.getItem('gamingToys_sheetUrl');
            if(url) document.getElementById('sheetUrl').value = url;
        }
    </script>
</body>
</html>
